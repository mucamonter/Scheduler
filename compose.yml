services:

#-----------------------------------------------
  db:

    image: mariadb:lts
    container_name: mariadb-server
    restart: unless-stopped
    #---

    ports:
      - "3306:3306"
    #---
    env_file:
      - .env
    #---
    environment:
      MYSQL_USER: "${DB_USER}"
      MYSQL_ROOT_PASSWORD: "${ADMIN_PASSWORD}"
      MYSQL_DATABASE: "mydb"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    #---
    volumes:
      - mysql_data:/var/lib/mysql
      - .backend/src/prisma:/docker-entrypoint-initdb.d:ro
    
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 20
#---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      target: ${NODE_ENV}
        
    ports: 
    - "${HOST_PORT}:${CONTAINER_PORT}"
    environment:
        - DATABASE_URL=${DATABASE_URL}
        
    command: sh -c "pnpm exec prisma db push --schema=schema.prisma && pnpm start:prod"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      target: ${NODE_ENV}
    ports:
      - "${CONTAINER_PORT}:${CONTAINER_PORT}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      DB_HOST: "mariadb"
      DB_PORT: ${DB_PORT}   
      ADMIN_USER: "${ADMIN_USER}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      DATABASE_URL: "${DATABASE_URL}"
      SESSION_SECRET: "${SESSION_SECRET}"
      PORT: ${CONTAINER_PORT}
      NODE_ENV: ${NODE_ENV}
    
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: