services:
  db:
    image: mariadb:lts
    container_name: mariadb-server
    ports:
      - "3306:3306"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_USER: "${DB_USER}"
      MYSQL_ROOT_PASSWORD: "${ADMIN_PASSWORD}"
      MYSQL_DATABASE: "mydb"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/prisma:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 0.0.0.0 -u root -pArdmin321 --silent || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      DB_HOST: "db"
      DB_PORT: "3306"
      ADMIN_USER: "${ADMIN_USER}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      DATABASE_URL: "${DATABASE_URL}"
      SESSION_SECRET: "${SESSION_SECRET}"
      PORT: "3000"
      NODE_ENV: development
    command: sh -c "pnpm exec prisma db push --schema=prisma/schema.prisma && pnpm start:prod"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: